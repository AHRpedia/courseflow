# Copy this content to .github/workflows/build.yml

name: Build Courseflow Windows Executables
 
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Build React UI
      run: npm run build
    
    - name: Run tests
      run: npm run test
      continue-on-error: true
    
    - name: Build NSIS installer
      run: npm run build:nsis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build Portable executable
      run: npm run build:portable
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: List dist files
      run: dir dist-electron
    
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: Courseflow-Setup
        path: dist-electron/Courseflow*.exe
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist-electron/Courseflow*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
